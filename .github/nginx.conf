server {
    listen 80;
    server_name _;

    root /var/www/myapp/frontend;
    index index.html;

    # CORS preflight для всех /api/ запросов
    location /api/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:8000;

        # HTTP/1.1 + очистка Connection обязательны для стриминга через nginx,
        # иначе upstream-соединение рвётся и клиент получает 502.
        proxy_http_version 1.1;
        proxy_set_header Connection '';

        # SSE: полностью отключаем любую буферизацию запроса и ответа
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Не обрываем долгий инференс. Онбординг 5–20с, чат 15–60с,
        # но держим запас, чтобы nginx не закрыл стрим раньше времени.
        proxy_connect_timeout 75s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # Подсказка для прокси/буферов не накапливать ответ
        proxy_set_header X-Accel-Buffering no;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'X-Accel-Buffering' 'no' always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback — все маршруты на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
