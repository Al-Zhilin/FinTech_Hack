name: Deploy Frontend

on:
  push:
    branches: [front]

jobs:
  deploy-frontend:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          ref: front

      - name: Install dependencies
        run: npm ci  # ← прямо в корне, без working-directory

      - name: Build React
        run: npm run build

      - name: Copy build to nginx root
        run: cp -r dist/* /var/www/myapp/frontend/