name: Deploy Backend

on:
  push:
    branches: [back]

jobs:
  deploy-backend:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          ref: back

      - name: Write .env
        env:
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          AI_SERVICE_URL: ${{ secrets.AI_SERVICE_URL }}
          CA_CERT_PATH: ${{ secrets.CA_CERT_PATH }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
        run: |
          printf 'PROJECT_NAME=HackathonBack\n'    >  /var/www/myapp/backend/.env
          printf 'VERSION=0.1.0\n'                 >> /var/www/myapp/backend/.env
          printf 'DEBUG=false\n'                   >> /var/www/myapp/backend/.env
          printf 'ALLOWED_ORIGINS=%s\n'   "$ALLOWED_ORIGINS"  >> /var/www/myapp/backend/.env
          printf 'AI_SERVICE_URL=%s\n'    "$AI_SERVICE_URL"   >> /var/www/myapp/backend/.env
          printf 'CA_CERT_PATH=%s\n'      "$CA_CERT_PATH"     >> /var/www/myapp/backend/.env
          printf 'MONGODB_URI=%s\n'       "$MONGODB_URI"      >> /var/www/myapp/backend/.env
          printf 'MONGODB_DB_NAME=%s\n'   "$MONGODB_DB_NAME"  >> /var/www/myapp/backend/.env

      - name: Write CA certificate
        run: |
          mkdir -p /var/www/myapp/backend/certs
          echo "${{ secrets.CA_CERT_B64 }}" | base64 -d > /var/www/myapp/backend/certs/ca.crt

      - name: Copy backend to app directory
        run: |
          rsync -a --exclude='.env' --exclude='venv' --exclude='__pycache__' \
            $GITHUB_WORKSPACE/ /var/www/myapp/backend/

      - name: Install backend dependencies
        run: |
          source /var/www/myapp/backend/venv/bin/activate
          pip install -r /var/www/myapp/backend/requirements.txt

      - name: Restart FastAPI
        run: sudo systemctl restart myapp

      - name: Wait for FastAPI to start
        run: |
          for i in {1..15}; do
            curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null && exit 0
            echo "Attempt $i: not ready yet..."
            sleep 2
          done
          echo "=== Service status ==="
          systemctl status myapp --no-pager || true
          echo "=== Last 50 log lines ==="
          journalctl -u myapp -n 50 --no-pager || true
          exit 1