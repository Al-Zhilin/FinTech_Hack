name: Deploy Frontend to VPS

on:
  push:
    branches: [front]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy build to nginx root
        run: |
          rm -rf /var/www/myapp/frontend/*
          cp -r dist/* /var/www/myapp/frontend/

      - name: Apply nginx config and reload
        run: |
          cp .github/nginx.conf /etc/nginx/sites-available/myapp
          ln -sf /etc/nginx/sites-available/myapp /etc/nginx/sites-enabled/myapp
          nginx -t && systemctl reload nginx
