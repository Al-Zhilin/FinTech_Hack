name: Deploy Frontend to VPS

on:
  push:
    branches: [front]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Copy build to nginx root
        run: |
          rm -rf /var/www/myapp/frontend/*
          cp -r dist/* /var/www/myapp/frontend/
