name: Deploy AI Service

on:
  push:
    branches: [ai]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Clone or pull
        run: |
          REPO="https://github.com/Al-Zhilin/FinTech_Hack.git"
          DIR="$HOME/hackathon/ai-service"
          if [ -d "$DIR/.git" ]; then
            cd "$DIR"
            git fetch origin
            git checkout ai
            git reset --hard origin/ai
          else
            git clone -b ai "$REPO" "$DIR"
          fi

      - name: Setup venv if missing
        run: |
          if [ ! -d "$HOME/hackathon/.venv" ]; then
            python3.11 -m venv "$HOME/hackathon/.venv"
          fi

      - name: Install deps
        run: |
          source "$HOME/hackathon/.venv/bin/activate"
          pip install --upgrade pip
          pip install -r "$HOME/hackathon/ai-service/requirements.txt"

      - name: Stop old service
        run: |
          pkill -f "uvicorn app.main:app.*8001" || true
          sleep 2

      - name: Start service
        run: |
          cd "$HOME/hackathon/ai-service"
          source "$HOME/hackathon/.venv/bin/activate"
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8001 \
            > "$HOME/hackathon/ai-service/uvicorn.log" \
            2> "$HOME/hackathon/ai-service/uvicorn_err.log" &
          disown
          sleep 5

      - name: Health check
        run: |
          curl -fsS http://localhost:8001/health || exit 1
          echo "AI Service is healthy"