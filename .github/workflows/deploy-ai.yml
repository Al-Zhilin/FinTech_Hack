name: Deploy AI Service

on:
  push:
    branches: [ai]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Clone or pull
        run: |
          REPO="https://github.com/AnywayHack/FinTech_Hack.git"
          DIR="$HOME/hackathon/ai-service"
          if [ -d "$DIR/.git" ]; then
            cd "$DIR"
            git fetch origin
            git checkout ai
            git reset --hard origin/ai
          else
            git clone -b ai "$REPO" "$DIR"
          fi

      - name: Setup venv if missing
        run: |
          if [ ! -d "$HOME/hackathon/.venv" ]; then
            python3.11 -m venv "$HOME/hackathon/.venv"
          fi

      - name: Install deps
        run: |
          source "$HOME/hackathon/.venv/bin/activate"
          pip install --upgrade pip
          pip install -r "$HOME/hackathon/ai-service/requirements.txt"

      - name: Restart service
        run: |
          sudo systemctl restart ai-service
          sleep 5

      - name: Health check
        run: |
          curl -fsS http://localhost:8001/health || exit 1
          echo "AI Service is healthy"